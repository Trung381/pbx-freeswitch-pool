volumes:
  freeswitch-recordings:
  minio-data:
  fsdata:
    driver_opts:
      type: none
      o: bind
      device: docker/fsdata
  cdata:
    driver_opts:
      type: none
      o: bind
      device: docker/cdata

networks:
  local_network:
    name: local_network

services:
  minio:
    # Pin the multi-architecture image digest: deploys must not change merely
    # because an upstream `latest` tag moves.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address :9000 --console-address :9001
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    networks:
      - local_network
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      PBX_MINIO_ACCESS_KEY: ${PBX_MINIO_ACCESS_KEY:?PBX_MINIO_ACCESS_KEY is required}
      PBX_MINIO_SECRET_KEY: ${PBX_MINIO_SECRET_KEY:?PBX_MINIO_SECRET_KEY is required}
      PBX_MINIO_BUCKET: ${PBX_MINIO_BUCKET:-pbx-recordings}
    volumes:
      - ./docker/minio/pbx-recordings-policy.json:/policy/pbx-recordings-policy.json:ro
    networks:
      - local_network
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing "local/$${PBX_MINIO_BUCKET}"
        mc anonymous set none "local/$${PBX_MINIO_BUCKET}"
        mc admin policy create local pbx-recordings /policy/pbx-recordings-policy.json || true
        mc admin user add local "$${PBX_MINIO_ACCESS_KEY}" "$${PBX_MINIO_SECRET_KEY}" || true
        mc admin policy attach local pbx-recordings --user "$${PBX_MINIO_ACCESS_KEY}"

  postgres:
    container_name: postgres-host
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: custompbx
      POSTGRES_PASSWORD: custompbx
      POSTGRES_DB: custompbx
    volumes:
      - /var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - local_network

  freeswitch:
    container_name: freeswitch-host
    hostname: freeswitch-host
    image: ghcr.io/custompbx/freeswitch:latest
    # Keep this profile setting in the deploy manifest because production uses
    # the published FreeSWITCH image rather than building docker/fs.Dockerfile.
    # Sofia then forks one INVITE to every registered browser/device contact of
    # an extension; the first device to answer wins and cancels its siblings.
    command:
      - /bin/sh
      - -ec
      - |
        sed -i 's|<!--<param name="multiple-registrations" value="contact"/>-->|<param name="multiple-registrations" value="contact"/>|' /etc/freeswitch/sip_profiles/internal.xml
        exec freeswitch -nonat
    depends_on:
      custompbx:
        #condition: service_healthy
        condition: service_started
    restart: always
    ports:
      - 5060:5060/tcp
      - 5060:5060/udp
      - 5061:5061/tcp
      - 5061:5061/udp
      - 5080:5080/tcp
      - 5080:5080/udp
      # TLS is terminated by the host Nginx. Keep both SIP WebSocket
      # listeners private so neither the clear-text WS listener nor the
      # FreeSWITCH WSS listener is reachable from the Internet.
      - 127.0.0.1:5066:5066/tcp
      - 127.0.0.1:7443:7443/tcp
      - 16384-16399:16384-16399/udp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/log/freeswitch/log
      - /usr/local/freeswitch/db
      - freeswitch-recordings:/var/lib/freeswitch/recordings
      # Keep the module list under version control. In particular, CDR database
      # writes are owned by CustomPBX's UTF-8-safe ESL consumer, not FreeSWITCH's
      # raw mod_cdr_pg_csv writer.
      - ./docker/fs_conf/modules.conf.xml:/etc/freeswitch/autoload_configs/modules.conf.xml:ro
      - ./docker/fs_override/vars.xml:/etc/freeswitch/vars.xml
      - ./docker/fs_override/external.xml:/etc/freeswitch/sip_profiles/external.xml
    networks:
      - local_network

  custompbx:
    container_name: custompbx-host
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: always
    environment:
      # Quick-start only: replace the unusable stock FreeSWITCH CDR sample DSN
      # when it is imported unchanged. User-configured CDR databases are preserved.
      CUSTOMPBX_DEMO_CDR_BOOTSTRAP: "true"
      PBX_CALL_WEBHOOK_URL: ${PBX_CALL_WEBHOOK_URL:-}
      PBX_CALL_WEBHOOK_SECRET: ${PBX_CALL_WEBHOOK_SECRET:-}
      PBX_CALL_WEBHOOK_PBX_ID: ${PBX_CALL_WEBHOOK_PBX_ID:-td1}
      PBX_CALL_WEBHOOK_SIP_DOMAIN: ${PBX_CALL_WEBHOOK_SIP_DOMAIN:-td1.tekomi.vn}
      PBX_TURN_SHARED_SECRET: ${PBX_TURN_SHARED_SECRET:-}
      PBX_TURN_EXTERNAL_IP: ${PBX_TURN_EXTERNAL_IP:-}
      PBX_TURN_REALM: ${PBX_TURN_REALM:-td1.tekomi.vn}
      PBX_TURN_TLS_PORT: ${PBX_TURN_TLS_PORT:-5349}
      PBX_TURN_TLS_CERT_FILE: ${PBX_TURN_TLS_CERT_FILE:-}
      PBX_TURN_TLS_KEY_FILE: ${PBX_TURN_TLS_KEY_FILE:-}
      # Private S3 endpoint. It is only reachable on Docker's internal network;
      # browser playback is proxied through the authenticated CDR endpoint.
      PBX_MINIO_ENDPOINT: ${PBX_MINIO_ENDPOINT:-minio:9000}
      PBX_MINIO_SECURE: "false"
      PBX_MINIO_BUCKET: ${PBX_MINIO_BUCKET:-pbx-recordings}
      PBX_MINIO_PREFIX: ${PBX_MINIO_PREFIX:-pbx/recordings}
      PBX_MINIO_ACCESS_KEY: ${PBX_MINIO_ACCESS_KEY:?PBX_MINIO_ACCESS_KEY is required}
      PBX_MINIO_SECRET_KEY: ${PBX_MINIO_SECRET_KEY:?PBX_MINIO_SECRET_KEY is required}
      PBX_RECORDING_API_BASE_URL: ${PBX_RECORDING_API_BASE_URL:-}
      PBX_RECORDING_FETCH_SECRET: ${PBX_RECORDING_FETCH_SECRET:-}
    ports:
      - 8080:8080
      - 8081:8081
      - 8082:8082
      - 3478:3478/udp
      - 3478:3478/tcp
      - 5349:5349/tcp
      - 49160-49200:49160-49200/udp
    volumes:
      - ./docker/config.json:/app/config.json
      - freeswitch-recordings:/app/recordings
    networks:
      - local_network
