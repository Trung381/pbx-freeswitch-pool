volumes:
  freeswitch-recordings:
  fsdata:
    driver_opts:
      type: none
      o: bind
      device: docker/fsdata
  cdata:
    driver_opts:
      type: none
      o: bind
      device: docker/cdata

networks:
  local_network:
    name: local_network

services:
  postgres:
    container_name: postgres-host
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: custompbx
      POSTGRES_PASSWORD: custompbx
      POSTGRES_DB: custompbx
    volumes:
      - /var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - local_network

  freeswitch:
    container_name: freeswitch-host
    hostname: freeswitch-host
    image: ghcr.io/custompbx/freeswitch:latest
    depends_on:
      custompbx:
        #condition: service_healthy
        condition: service_started
    restart: always
    ports:
      - 5060:5060/tcp
      - 5060:5060/udp
      - 5061:5061/tcp
      - 5061:5061/udp
      - 5080:5080/tcp
      - 5080:5080/udp
      - 7443:7443/tcp
      - 16384-16399:16384-16399/udp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/log/freeswitch/log
      - /usr/local/freeswitch/db
      - freeswitch-recordings:/var/lib/freeswitch/recordings
      - ./docker/fs_override/vars.xml:/etc/freeswitch/vars.xml
      - ./docker/fs_override/external.xml:/etc/freeswitch/sip_profiles/external.xml
      - ./docker/fs_override/internal.xml:/etc/freeswitch/sip_profiles/internal.xml
    networks:
      - local_network

  custompbx:
    container_name: custompbx-host
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_started
    restart: always
    environment:
      # Quick-start only: replace the unusable stock FreeSWITCH CDR sample DSN
      # when it is imported unchanged. User-configured CDR databases are preserved.
      CUSTOMPBX_DEMO_CDR_BOOTSTRAP: "true"
      PBX_CALL_WEBHOOK_URL: ${PBX_CALL_WEBHOOK_URL:-}
      PBX_CALL_WEBHOOK_SECRET: ${PBX_CALL_WEBHOOK_SECRET:-}
      PBX_TURN_SHARED_SECRET: ${PBX_TURN_SHARED_SECRET:-}
      PBX_TURN_EXTERNAL_IP: ${PBX_TURN_EXTERNAL_IP:-}
      PBX_TURN_REALM: ${PBX_TURN_REALM:-td1.tekomi.vn}
      PBX_TURN_TLS_PORT: ${PBX_TURN_TLS_PORT:-5349}
      PBX_TURN_TLS_CERT_FILE: ${PBX_TURN_TLS_CERT_FILE:-}
      PBX_TURN_TLS_KEY_FILE: ${PBX_TURN_TLS_KEY_FILE:-}
    ports:
      - 8080:8080
      - 8081:8081
      - 8082:8082
      - 3478:3478/udp
      - 3478:3478/tcp
      - 5349:5349/tcp
      - 49160-49200:49160-49200/udp
    volumes:
      - ./docker/config.json:/app/config.json
      - freeswitch-recordings:/app/recordings
    networks:
      - local_network
