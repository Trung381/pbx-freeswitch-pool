loadmodule "nathelper.so"
modparam("nathelper", "received_avp", "$avp(received)")

loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"

####### Routing Logic ########

route {
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        if (is_method("ACK") && t_check_trans()) {
            t_relay();
            exit;
        }
        if (!loose_route()) {
            send_reply(404, "Not here");
            exit;
        }
        route(relay);
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) t_relay();
        exit;
    }

    t_check_trans();

    # Trusted trunk ingress → FS external profile (setid 2).
    if ($si == "125.212.225.105" || $si == "103.69.97.113") {
        xlog("L_INFO", "SBC inbound trunk src=$si ci=$ci to=$tU\n");
        if (!ds_select_dst(2, 4)) {
            send_reply(500, "No trunk backend available");
            exit;
        }
        route(relay);
        exit;
    }

    # Everything else (REGISTER + INVITE + …) → FS internal (setid 1).
    if (is_method("REGISTER")) {
        xlog("L_INFO", "SBC register src=$si user=$fU ci=$ci\n");
        if (nat_uac_test("private-contact,diff-ip-src-via,diff-ip-src-contact")) {
            fix_nated_register();
            setbflag("NAT");
        }
        if (!ds_select_dst(1, 4)) {
            send_reply(500, "No internal backend available");
            exit;
        }
        route(relay);
        exit;
    }

    if (is_method("INVITE|SUBSCRIBE|MESSAGE|NOTIFY|PUBLISH|REFER|INFO|UPDATE|PRACK|OPTIONS")) {
        xlog("L_INFO", "SBC $rm src=$si fU=$fU tU=$tU ci=$ci\n");
        if (nat_uac_test("private-contact,diff-ip-src-via,diff-ip-src-contact")) {
            fix_nated_contact();
            setbflag("NAT");
        }
        if (!ds_select_dst(1, 4)) {
            send_reply(500, "No internal backend available");
            exit;
        }
        route(relay);
        exit;
    }

    send_reply(405, "Method Not Allowed");
}

route[relay] {
    if (is_method("INVITE")) {
        if (!rtpengine_offer()) {
            xlog("L_WARN", "rtpengine offer failed ci=$ci\n");
        }
        t_on_reply("handle_rtp");
        t_on_failure("relay_failure");
    }
    if (isbflagset("NAT")) {
        add_rr_param(";nat=yes");
    }
    if (!t_relay()) {
        send_reply(500, "Internal relay error");
    }
    exit;
}

onreply_route[handle_rtp] {
    if (nat_uac_test("private-contact")) fix_nated_contact();
    if (has_body("application/sdp")) {
        rtpengine_answer();
    }
}

failure_route[relay_failure] {
    if (t_was_cancelled()) exit;
    if (t_check_status("(408|500|503)")) {
        xlog("L_WARN", "SBC relay failed, trying next backend ci=$ci\n");
        if (ds_next_dst()) {
            t_on_failure("relay_failure");
            t_relay();
        }
    }
    rtpengine_delete();
}
