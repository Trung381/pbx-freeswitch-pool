# Observability stack (logs + metrics + dashboards) for PBX-FREESWITCH-POOL.
#
# Chay cung compose chinh de dung chung network:
#   docker compose -f docker-compose.observability.yml --env-file .env up -d
# Network `local_network` do compose chinh (pbx-freeswitch-pool) tao; khai bao external.
#
# RAM rat chat (VPS 3.8GB): moi container deu co mem_limit + cpus.

name: pbx-observability

volumes:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  alloy-data:
  # Volume log FreeSWITCH do docker-compose.observability-fs-log.yml (compose chinh) tao.
  freeswitch-logs:
    external: true
    name: ${FS_LOG_VOLUME:-pbx-freeswitch-pool_freeswitch-logs}

networks:
  local_network:
    external: true
    name: local_network
  obs:
    name: pbx_obs

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  loki:
    <<: *common
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml", "-log.level=warn"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [obs]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Tracing (OpenTelemetry). custompbx gui OTLP gRPC toi tempo:4317 qua local_network khi
  # CUSTOMPBX_OTEL_ENDPOINT duoc dat. Khong publish port ra host.
  tempo:
    <<: *common
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [obs, local_network]   # local_network: nhan trace tu custompbx
    mem_limit: 192m
    cpus: 0.5

  prometheus:
    <<: *common
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-10d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-1GB}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [obs, local_network]   # local_network: scrape custompbx:9102
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 32m
    cpus: 0.2
    networks: [obs]

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.9.0
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.diskstats
      - --collector.netdev
      - --collector.loadavg
      - --collector.uname
      - --collector.vmstat
      - --collector.filefd
      - --collector.time
      - --collector.stat
      - --collector.pressure
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($|/)
    volumes:
      - /:/host:ro,rslave
    networks: [obs]
    pid: host
    mem_limit: 48m
    cpus: 0.2

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=disk,percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true   # cAdvisor can doc cgroup/ten container chi khi co quyen nay
    networks: [obs]
    mem_limit: 160m
    cpus: 0.4

  alloy:
    <<: *common
    image: grafana/alloy:v1.7.5
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - freeswitch-logs:/var/log/freeswitch:ro
      # Doc log container qua Docker API. docker.sock tuong duong quyen root tren host;
      # mount read-only chi han che ghi file, khong han che API. Chap nhan cho dev; xem README.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs]
    mem_limit: 256m
    cpus: 0.5

  grafana:
    <<: *common
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://10.77.0.1:3000}
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pbx-health.json
      # Secret cho provisioning ($__env{...})
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:?GRAFANA_PG_PASSWORD is required}
      # Gia tri placeholder de provisioning khong loi khi chua cau hinh Telegram (se gui that bai co chu dich).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-0000000000:telegram-chua-cau-hinh}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-chat-chua-cau-hinh}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Chi bind vao IP WireGuard (wg0), KHONG phai 0.0.0.0.
      - "${GRAFANA_BIND_ADDR:-10.77.0.1}:3000:3000"
    networks: [obs, local_network]   # local_network: doc Postgres (user chi doc)
    depends_on:
      loki: {condition: service_healthy}
      tempo: {condition: service_started}
      prometheus: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
