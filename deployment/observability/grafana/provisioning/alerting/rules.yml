# SINH TU DONG boi tools/gen_grafana.py - dung sua tay.
apiVersion: 1
groups:
  - orgId: 1
    name: "Host"
    folder: PBX Alerts
    interval: 1m
    rules:
      - {"uid": "pbx-disk-warn", "title": "O dia / >= 80%", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [80]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "10m", "annotations": {"summary": "O dia / dung {{ $values.B }}% (>= 80%). Don build cache/log/image cu."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-disk-crit", "title": "O dia / >= 90%", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [90]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "5m", "annotations": {"summary": "O dia / dung {{ $values.B }}% (>= 90%) - sap day, Postgres/Loki co the ngung ghi."}, "labels": {"severity": "critical", "project": "pbx"}}
      - {"uid": "pbx-ram-low", "title": "RAM kha dung < 10%", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "lt", "params": [10]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "5m", "annotations": {"summary": "RAM kha dung chi con {{ $values.B }}%."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-infra-target-down", "title": "Target giam sat ha tang DOWN", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "min(up{job=~\"node|cadvisor|loki|prometheus|alloy\"})", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "lt", "params": [1]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "Alerting", "execErrState": "Error", "for": "5m", "annotations": {"summary": "Mot target giam sat (node/cadvisor/loki/alloy) khong scrape duoc."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-ext-chatwoot-down", "title": "Chatwoot (chat1.techxanh.com) khong truy cap duoc", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "min(probe_success{job=\"blackbox-http\"})", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "lt", "params": [1]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "3m", "annotations": {"summary": "VPS PBX khong goi duoc https://chat1.techxanh.com (Chatwoot) trong 3 phut."}, "labels": {"severity": "critical", "project": "pbx"}}
  - orgId: 1
    name: "Container"
    folder: PBX Alerts
    interval: 1m
    rules:
      - {"uid": "pbx-container-restart", "title": "Container PBX restart", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 900, "to": 0}, "model": {"refId": "A", "expr": "sum(changes(container_start_time_seconds{name=~\"freeswitch-host|custompbx-host|postgres-host|pbx-freeswitch-pool-minio-[0-9]+\"}[15m]))", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 900, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 900, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [0]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "0s", "annotations": {"summary": "Co container PBX vua khoi dong lai trong 15 phut gan day."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-freeswitch-down", "title": "FreeSWITCH down", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "A", "expr": "count(time() - container_last_seen{name=\"freeswitch-host\"} < 120) or vector(0)", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "lt", "params": [1]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "Alerting", "execErrState": "Error", "for": "2m", "annotations": {"summary": "Container freeswitch-host khong chay."}, "labels": {"severity": "critical", "project": "pbx"}}
      - {"uid": "pbx-custompbx-down", "title": "custompbx down", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "A", "expr": "count(time() - container_last_seen{name=\"custompbx-host\"} < 120) or vector(0)", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "lt", "params": [1]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "Alerting", "execErrState": "Error", "for": "2m", "annotations": {"summary": "Container custompbx-host khong chay."}, "labels": {"severity": "critical", "project": "pbx"}}
      - {"uid": "pbx-postgres-down", "title": "Postgres down", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "A", "expr": "count(time() - container_last_seen{name=\"postgres-host\"} < 120) or vector(0)", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 300, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "lt", "params": [1]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "Alerting", "execErrState": "Error", "for": "2m", "annotations": {"summary": "Container postgres-host khong chay."}, "labels": {"severity": "critical", "project": "pbx"}}
  - orgId: 1
    name: "PBX app"
    folder: PBX Alerts
    interval: 1m
    rules:
      - {"uid": "pbx-esl-down", "title": "ESL mat ket noi FreeSWITCH", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "pbx_esl_connected", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "lt", "params": [1]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "2m", "annotations": {"summary": "custompbx mat ket noi ESL toi FreeSWITCH.", "description": "Chi hoat dong sau khi custompbx duoc deploy voi /metrics."}, "labels": {"severity": "critical", "project": "pbx"}}
      - {"uid": "pbx-metrics-target-down", "title": "custompbx /metrics DOWN (da tung UP)", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "up{job=\"custompbx\"} == 0 and max_over_time(up{job=\"custompbx\"}[7d]) == 1", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [0]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "10m", "annotations": {"summary": "Prometheus khong scrape duoc custompbx:9102 (truoc do da UP). Khong canh bao khi chua tung deploy."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-call-failures", "title": "Cuoc goi loi tang dot bien", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 900, "to": 0}, "model": {"refId": "A", "expr": "sum(increase(pbx_calls_total{hangup_cause=~\"NO_ROUTE_DESTINATION|BEARERCAPABILITY_NOTAUTH|INCOMPATIBLE_DESTINATION|DESTINATION_OUT_OF_ORDER|NETWORK_OUT_OF_ORDER|NORMAL_TEMPORARY_FAILURE|SWITCH_CONGESTION|RECOVERY_ON_TIMER_EXPIRE|MEDIA_TIMEOUT|GATEWAY_DOWN|SERVICE_UNAVAILABLE|CHAN_NOT_IMPLEMENTED|MANDATORY_IE_MISSING|PROTOCOL_ERROR\"}[15m])) or vector(0)", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 900, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 900, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [20]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "0s", "annotations": {"summary": "{{ $values.B }} cuoc goi loi trong 15 phut (> 20).", "description": "Neu NO_ROUTE_DESTINATION lien tuc: co the dang bi quet SIP (SIP scanning) hoac sai dialplan."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-gateway-unreg", "title": "Trunk/gateway mat dang ky", "condition": "C", "data": [{"datasourceUid": "prometheus", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "count(pbx_gateway_state{state=~\"FAIL_WAIT|FAILED|UNREGED|UNREGISTER|TRYING|DOWN\"}) or vector(0)", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "prometheus", "uid": "prometheus"}, "instant": true, "range": false, "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [0]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "5m", "annotations": {"summary": "Co gateway FreeSWITCH khong o trang thai REGED (FAIL_WAIT/FAILED/UNREGED/TRYING)."}, "labels": {"severity": "critical", "project": "pbx"}}
  - orgId: 1
    name: "Log"
    folder: PBX Alerts
    interval: 1m
    rules:
      - {"uid": "pbx-webhook-fail", "title": "Call webhook gui loi", "condition": "C", "data": [{"datasourceUid": "loki", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "sum(count_over_time({container=\"custompbx-host\"} |= \"Call webhook delivery failed\" [10m]))", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "loki", "uid": "loki"}, "queryType": "instant", "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [5]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "0s", "annotations": {"summary": "{{ $values.B }} lan gui call webhook that bai trong 10 phut.", "description": "Dem tu log (dispatcher.go chua co metric rieng; van dung std log nen chuoi nam trong truong msg cua dong JSON)."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-app-errors", "title": "custompbx nhieu log ERROR", "condition": "C", "data": [{"datasourceUid": "loki", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "sum(count_over_time({container=\"custompbx-host\", level=\"ERROR\"}[10m]))", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "loki", "uid": "loki"}, "queryType": "instant", "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [20]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "0s", "annotations": {"summary": "{{ $values.B }} dong log level=error cua custompbx trong 10 phut.", "description": "Log JSON (slog): xem theo component/call_uuid trong dashboard Log explorer."}, "labels": {"severity": "warning", "project": "pbx"}}
      - {"uid": "pbx-fs-errors", "title": "FreeSWITCH nhieu log ERR/CRIT", "condition": "C", "data": [{"datasourceUid": "loki", "refId": "A", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "A", "expr": "sum(count_over_time({job=\"freeswitch\", level=~\"ERR|CRIT|ALERT\"}[10m]))", "intervalMs": 1000, "maxDataPoints": 43200, "datasource": {"type": "loki", "uid": "loki"}, "queryType": "instant", "editorMode": "code"}}, {"datasourceUid": "__expr__", "refId": "B", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "B", "type": "reduce", "expression": "A", "reducer": "last", "settings": {"mode": "dropNN"}, "datasource": {"type": "__expr__", "uid": "__expr__"}}}, {"datasourceUid": "__expr__", "refId": "C", "relativeTimeRange": {"from": 600, "to": 0}, "model": {"refId": "C", "type": "threshold", "expression": "B", "datasource": {"type": "__expr__", "uid": "__expr__"}, "conditions": [{"evaluator": {"type": "gt", "params": [30]}, "operator": {"type": "and"}, "query": {"params": ["C"]}, "reducer": {"type": "last", "params": []}, "type": "query"}]}}], "noDataState": "OK", "execErrState": "Error", "for": "0s", "annotations": {"summary": "{{ $values.B }} dong log ERR/CRIT/ALERT cua FreeSWITCH trong 10 phut."}, "labels": {"severity": "warning", "project": "pbx"}}
