apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
      httpMethod: POST
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Dong log JSON cua custompbx co "trace_id":"..." -> link sang trace trong Tempo.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: Xem trace
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Tu trace sang log custompbx (log JSON co trace_id nhung khong la label => loc bang chuoi).
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{container="custompbx-host"} |= "$${__trace.traceId}"'
      search:
        hide: false
      nodeGraph:
        enabled: false
  # User Postgres CHI DOC (xem postgres/create-grafana-ro.sql). Khong dung user admin cua app.
  - name: PBX Postgres (CDR/HEP)
    uid: pbx-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres-host:5432
    user: grafana_ro
    secureJsonData:
      password: $__env{GRAFANA_PG_PASSWORD}
    jsonData:
      database: custompbx
      sslmode: disable
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
