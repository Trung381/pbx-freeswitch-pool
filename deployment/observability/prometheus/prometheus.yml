global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]

  - job_name: node
    static_configs: [{targets: ['node-exporter:9100']}]

  - job_name: cadvisor
    static_configs: [{targets: ['cadvisor:8080']}]
    metric_relabel_configs:
      # Giu series cua cac container (name != ""), bo series cgroup he thong de giam cardinality.
      - source_labels: [name]
        regex: ''
        action: drop
      - source_labels: [__name__]
        regex: 'container_(tasks_state|memory_failures_total|fs_(io_time_weighted|reads_merged|writes_merged|sector_.*)_.*|blkio_.*|network_.*_(dropped|errors)_total)'
        action: drop

  - job_name: loki
    static_configs: [{targets: ['loki:3100']}]

  - job_name: alloy
    static_configs: [{targets: ['alloy:12345']}]

  - job_name: grafana
    static_configs: [{targets: ['grafana:3000']}]

  # /metrics cua custompbx (cong 9102, chi trong docker network, khong publish ra host).
  # Se la DOWN cho den khi custompbx duoc build/deploy lai voi ma moi.
  - job_name: custompbx
    static_configs: [{targets: ['custompbx:9102']}]
