# Loki single-binary, luu file system, retention 5 ngay (120h).
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 120h
  reject_old_samples: true
  reject_old_samples_max_age: 120h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_line_size: 64KB
  max_query_series: 2000
  volume_enabled: true
  allow_structured_metadata: true
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 1h
  compaction_interval: 30m
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: false
analytics:
  reporting_enabled: false
ingester:
  chunk_idle_period: 30m
  max_chunk_age: 2h
  chunk_target_size: 524288
