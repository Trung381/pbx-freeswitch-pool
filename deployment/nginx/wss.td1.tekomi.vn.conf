server {
    listen 80;
    listen [::]:80;
    server_name wss.td1.tekomi.vn;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wss.td1.tekomi.vn;

    ssl_certificate /etc/letsencrypt/live/wss.td1.tekomi.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wss.td1.tekomi.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # Terminate public WSS here and use plain WS only over loopback.
        # This avoids a second TLS parser in FreeSWITCH holding a complete
        # authenticated INVITE until another WSS frame arrives.
        proxy_pass http://127.0.0.1:5066;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
